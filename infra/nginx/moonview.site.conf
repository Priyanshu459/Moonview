upstream moonview_api {
  server 127.0.0.1:3001;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  access_log /var/log/nginx/moonview_access.log;
  error_log  /var/log/nginx/moonview_error.log warn;

  client_max_body_size 100m;
  client_body_timeout 600s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://moonview_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;
  }

  location ^~ /media/hls/ {
    alias /var/lib/moonview/public-media/hls/;
    autoindex off;

    location ~* \.m3u8$ {
      add_header Content-Type "application/vnd.apple.mpegurl" always;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~* \.ts$ {
      add_header Content-Type "video/mp2t" always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
  }

  location ^~ /media/posters/ {
    alias /var/lib/moonview/public-media/posters/;
    autoindex off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  location ^~ /media/backdrops/ {
    alias /var/lib/moonview/public-media/backdrops/;
    autoindex off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  location ^~ /media/ {
    return 404;
  }

  root /opt/moonview/current/frontend/dist;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
