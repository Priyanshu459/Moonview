# =============================================================================
# Moonview — Nginx Configuration (Oracle Cloud / Production)
# Phase 1: Template — activate in Phase 16
# =============================================================================
#
# Architecture:
#   Cloudflare → Nginx → React (static) / Node.js API
#   Cloudflare → Nginx → /media (direct, bypasses Node.js)
#
# Prerequisites:
#   - Certbot/Let's Encrypt SSL (managed via Cloudflare)
#   - Node.js API running on 127.0.0.1:3001 (via PM2)
#   - React build output at /var/www/moonview/frontend/dist
#   - Media files at /mnt/media

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  # ---------------------------------------------------------------------------
  # Logging
  # ---------------------------------------------------------------------------
  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';

  access_log /var/log/nginx/moonview_access.log main;
  error_log  /var/log/nginx/moonview_error.log warn;

  # ---------------------------------------------------------------------------
  # Performance
  # ---------------------------------------------------------------------------
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  types_hash_max_size 2048;

  # Gzip compression (text assets only — video is already compressed)
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript
             image/svg+xml;
  gzip_vary on;
  gzip_min_length 1024;

  # Upload size limit — 10 GB for video uploads via admin
  client_max_body_size 10g;
  client_body_timeout  3600s;

  # ---------------------------------------------------------------------------
  # Node.js API upstream
  # ---------------------------------------------------------------------------
  upstream moonview_api {
    server 127.0.0.1:3001;
    keepalive 32;
  }

  # ---------------------------------------------------------------------------
  # HTTP → HTTPS redirect
  # ---------------------------------------------------------------------------
  server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    return 301 https://$host$request_uri;
  }

  # ---------------------------------------------------------------------------
  # Main HTTPS server
  # ---------------------------------------------------------------------------
  server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # API — forward to Node.js (do NOT cache authenticated responses)
    # -------------------------------------------------------------------------
    location /api/ {
      proxy_pass http://moonview_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;

      # Timeouts for large file uploads
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_request_buffering off;
    }

    # -------------------------------------------------------------------------
    # Media — served DIRECTLY by Nginx (bypasses Node.js entirely)
    # HLS .m3u8 and .ts files served with correct MIME types
    # -------------------------------------------------------------------------
    # Originals and processing workspaces are never public files.
    location ^~ /media/originals/ { deny all; }
    location ^~ /media/processed/ { deny all; }

    location /media/ {
      alias /mnt/media/;

      # Serve HLS files
      location ~* \.m3u8$ {
        add_header Content-Type "application/vnd.apple.mpegurl" always;
        add_header Cache-Control "no-cache, no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
      }

      location ~* \.ts$ {
        add_header Content-Type "video/mp2t" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
      }

      # Video files — enable Range request support
      location ~* \.(mp4|webm)$ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600" always;
        mp4;  # Nginx mp4 module for Range request support
        mp4_buffer_size 4m;
        mp4_max_buffer_size 20m;
      }

      # Images (posters, backdrops, thumbnails)
      location ~* \.(jpg|jpeg|png|webp|avif)$ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        expires 30d;
      }

      # Deny directory listing
      autoindex off;
    }

    # -------------------------------------------------------------------------
    # React SPA — static files with HTML5 history API support
    # -------------------------------------------------------------------------
    root /var/www/moonview/frontend/dist;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }
}
